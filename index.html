<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gnomono's Etch a Sketch</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="script.js"></script>
</head>
<body>

    <header class="header">
        <h1 class="header-title">Etch a Sketch!</h1>
        <p class="header-author">By Gnomono</p>
    </header>

    <main>
        <div class="grid-size-container">
            <label for="grid-size">Enter Grid Size</label>
            <input type="number" id="grid-size">
            <button id="create-grid-btn">create grid</button>
        </div>
        <div id="grid" class="grid"></div>
    </main>

    <footer class="footer">
        <p>Copyright &copy; 2026 Gnomono | The Odin Project</p>
    </footer>

    <div class="alert">
        <div class="alert-message-box">
            <h2>Etch-a-Message!</h2>
            <p id="error-text">error text</p>
            <button id="close-btn">OK!</button>
        </div>
    </div>
    
</body>
</html>
